name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Prepare Godot environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          cp -a /root/.config/godot "$HOME/.config/"
          cp -a /root/.local/share/godot/export_templates/4.6.3.stable \
            "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          godot --version

      - name: Export Android APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p builds
          set +e
          godot --headless --verbose --path . \
            --export-debug "Android Debug" builds/orbit-clash-debug.apk \
            2>&1 | tee builds/export.log
          export_status=${PIPESTATUS[0]}
          set -e
          if [ "$export_status" -ne 0 ]; then
            error_summary="$(tail -n 80 builds/export.log | grep -v 'Unable to load fontconfig' | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Godot Android export failed::$error_summary"
            exit "$export_status"
          fi

      - name: Verify APK
        run: test -s builds/orbit-clash-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: orbit-clash-android-debug
          path: builds/orbit-clash-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: orbit-clash-export-log
          path: builds/export.log
          if-no-files-found: warn
          retention-days: 7
